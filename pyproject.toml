[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lane-repro"
version = "0.1.0"
description = "Independent, offline lane detection reproducibility and benign robustness study"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.15.3", "scikit-image==0.25.2", "opencv-python-headless==4.11.0.86", "PyYAML==6.0.2", "addict==2.4.0", "yapf==0.40.1", "psutil==7.0.0", "scikit-learn==1.6.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
